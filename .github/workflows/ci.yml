name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.2
      - name: Install test dependencies
        run: python -m pip install -e . pytest numpy==1.26.4 pyarrow==18.1.0
      - name: Compile source
        run: python -m compileall -q src
      - name: Run tests
        run: pytest -q
