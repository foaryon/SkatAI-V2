model_and_cost_strategy:
  principle: Concentrate expensive intelligence in the Orchestrator Superbrain. Workers are bounded executors and
    should use deterministic tools or the lowest-cost AI model/reasoning level that can reliably execute the assigned
    contract.
  economic_goal: Maximize verified project progress per unit cost while preserving correctness, scientific validity,
    recoverability, and deployment quality.
  orchestrator_superbrain:
    model_role: high_capacity_global_reasoning_model
    target_class: current_main_agent_class
    configured_ceiling: GPT-6-SOL-equivalent-or-lower
    default_reasoning_effort: medium
    higher_reasoning_by_default: false
    optimize_for:
    - global_project_understanding
    - strategic_planning
    - task_decomposition
    - dependency_reasoning
    - cross_worker_coordination
    - scientific_judgment
    - evidence_synthesis
    - conflict_resolution
    - recovery_decisions
    - release_and_promotion_decisions
    must_not_be_used_for:
    - routine_monitoring
    - mechanical_state_collection
    - simple_log_parsing
    - ordinary_test_execution
    - simple_file_transforms
    - routine_packaging_steps
    - repetitive_worker_execution
    reasoning_escalation:
      enabled: true
      default: false
      allowed_when:
      - major_architecture_conflict
      - difficult_root_cause_analysis
      - ambiguous_scientific_methodology
      - cross_agent_evidence_conflict
      - high_consequence_release_decision
      - high_consequence_model_promotion_decision
      rule: Escalate reasoning effort only when the expected value of additional reasoning materially exceeds its
        latency and cost.
  workers:
    role: bounded_order_following_executors
    default_reasoning_effort: low
    default_model_policy: cheapest_reliably_capable
    global_project_understanding_required: false
    global_strategy_authority: false
    independent_priority_authority: false
    may_self_upgrade_to_superbrain_class: false
    preferred_execution_order:
    - deterministic_code_or_tool
    - very_low_cost_model
    - low_cost_model
    - mid_cost_model_only_if_contract_requires_it
    - escalate_to_orchestrator_superbrain
    worker_design_rule: A worker should not need broad intelligence. The Orchestrator supplies the objective, context
      slice, authority, constraints, evidence requirements, success criteria, and expected result schema.
    escalate_instead_of_improvise_when:
    - task_contract_is_ambiguous
    - unexpected_state_materially_changes_scope
    - evidence_conflicts
    - required_authority_is_missing
    - scientific_validity_is_uncertain
    - destructive_or_high_risk_action_is_required
    - repeated_failure_occurs
    - global_priority_tradeoff_is_required
    - architecture_decision_is_required
    - promotion_or_release_judgment_is_required
  deterministic_first_policy:
    rule: If a task can be completed reliably by deterministic software, scripts, validators, schedulers, parsers,
      tests, or infrastructure APIs, use them before invoking an LLM.
    preferred_for:
    - schema_validation
    - hashing_and_checksums
    - file_and_manifest_validation
    - repository_state_collection
    - process_health_checks
    - metrics_collection
    - test_execution
    - artifact_copy_and_packaging
    - simple_data_transforms
    - queue_and_state_transitions
    - budget_accounting
    - duplicate_detection
    - basic_threshold_checks
  task_model_router:
    selection_factors:
    - task_complexity
    - ambiguity
    - error_consequence
    - reasoning_depth
    - tool_complexity
    - context_size
    - evidence_interpretation_need
    - prior_failure_history
    routing_examples:
      state_collection:
        preferred: deterministic_code_or_tool
        fallback: very_low_cost_model
        reasoning: minimal
      log_parsing:
        preferred: very_low_cost_model
        reasoning: low
      run_tests_and_report:
        preferred: deterministic_code_or_tool
        fallback: very_low_cost_model
        reasoning: minimal
      dataset_validation:
        preferred: deterministic_plus_low_cost_model
        reasoning: low
      training_job_control:
        preferred: low_cost_model
        reasoning: low
      iss_runtime_operation:
        preferred: deterministic_runtime_plus_low_cost_model
        reasoning: low
      documentation_update:
        preferred: low_cost_model
        reasoning: low
      ordinary_bounded_code_change:
        preferred: low_cost_model
        fallback: mid_cost_model
        reasoning: low_to_medium
      difficult_local_debugging:
        preferred: mid_cost_model
        fallback: orchestrator_superbrain
        reasoning: medium
      architecture_decision:
        preferred: orchestrator_superbrain
        reasoning: medium
      scientific_methodology_decision:
        preferred: orchestrator_superbrain
        reasoning: medium
      model_promotion_decision:
        preferred: orchestrator_superbrain
        reasoning: medium
      cross_worker_conflict_resolution:
        preferred: orchestrator_superbrain
        reasoning: medium
      roadmap_prioritization:
        preferred: orchestrator_superbrain
        reasoning: medium
  worker_escalation_packet:
    required_fields:
    - task_id
    - worker_id
    - observed_state
    - completed_work
    - blocking_issue
    - evidence
    - attempted_actions
    - reason_for_escalation
    - options_if_known
    rule: Escalation is preferable to speculative reasoning. Workers preserve evidence and return control to the
      Orchestrator when bounded execution stops being safe or sufficiently deterministic.
  context_and_token_efficiency:
    worker_context_policy: minimum_sufficient_context
    send_full_work_prompt_to_workers: false
    send_full_project_history_to_workers: false
    send_only_relevant_spec_sections: true
    summarize_large_evidence_before_llm_when_safe: true
    cache_stable_context: true
    reuse_prior_verified_results: true
    batch_simple_independent_operations: true
    avoid_repeated_reasoning: true
    avoid_repeated_repository_reads_without_state_change: true
    avoid_repeated_log_scans_without_new_hypothesis: true
    superbrain_prefers_structured_worker_summaries: true
    raw_evidence_remains_available_on_demand: true
  cost_controls:
    track_cost_per_task: true
    track_cost_per_worker: true
    track_cost_per_verified_outcome: true
    track_tokens_per_task: true
    track_model_tier_usage: true
    worker_budget_required: true
    default_worker_budget_policy: small_bounded_budget
    orchestrator_budget_policy: larger_but_bounded
    budget_exhaustion_behavior: pause_and_escalate_not_silently_upgrade
    cost_anomaly_detection: true
    repeated_no_progress_spend_detection: true
    prohibit_idle_llm_spend: true
    prohibit_monitoring_only_llm_loops: true
    prohibit_unbounded_retry_spend: true
    optimize_metric: verified_progress_per_cost
  cost_invariants:
  - Only the Orchestrator requires high-capacity global reasoning by default.
  - Workers must not receive expensive models merely because they are available.
  - Workers must not compensate for unclear task contracts with broader autonomous reasoning.
  - Routine observation and execution should be deterministic whenever practical.
  - Model escalation requires an explicit reason and must be visible in task telemetry.
  - No worker may silently switch to a higher-cost model tier.
  - No autonomous LLM call is justified by idleness alone.
  - Repeated no-progress calls must be stopped and escalated.
