schema_version: 1.1.0
kind: SkatAIOrchestratorArchitecture
metadata:
  project_id: skatai-v2
  project_name: SkatAI V2
  architecture_name: Orchestrator Superbrain + Coordinated Worker Agents
  status: implementation_blueprint_cost_optimized
  canonical_format: yaml
  description: 'Machine-readable control-plane architecture for SkatAI V2. One persistent Orchestrator Superbrain
    owns global project context, strategy, coordination, and progress toward the complete end state. Specialized
    worker agents/sessions receive bounded work contracts, execute partial tasks, and return evidence-backed results
    for verification and integration.

    '
project:
  mission: 'Build SkatAI V2 into a clean, reproducible, deployment-valid and continuously improving Skat AI system
    that autonomously acquires and validates data, trains challengers, evaluates them scientifically, rejects or
    promotes them by predefined evidence, recovers from failures, competes externally where useful, preserves useful
    evidence, feeds weaknesses back into development, packages and validates releases reproducibly, and exposes
    them through one stable SkatAI interface integrated into real Skat software.

    '
  final_goal:
    id: strong_integrated_skat_ai
    statement: 'A strong, reproducible, deployment-valid Skat AI integrated through one stable SkatAI interface
      into real Skat software, with continuous evidence-driven improvement and autonomous recovery.

      '
    required_capabilities:
    - autonomous_data_acquisition
    - validated_versioned_datasets
    - reproducible_training
    - controlled_scientific_evaluation
    - predefined_reject_promote_gates
    - accepted_model_registry
    - reproducible_release_packaging
    - deployment_validation
    - stable_skatai_runtime_interface
    - iss_live_play_and_evidence
    - weakness_feedback_loop
    - autonomous_recovery
    - durable_project_state
    - final_skat_software_integration
authoritative_context:
  sources:
  - id: founding_specification
    path: SKATAI_V2_FOUNDING_SPECIFICATION.md
    role: binding_project_constitution
    required: true
    refresh_policy: read_before_substantive_strategy_or_architecture_changes
    authority_rank: 1
  - id: verified_current_state
    role: freshest_verified_reality
    required: true
    includes:
    - repository_state
    - repository_revision
    - dirty_worktree
    - runtime_processes
    - controller_state
    - infrastructure_state
    - storage_state
    - datasets
    - models
    - checkpoints
    - experiment_manifests
    - evaluation_results
    - release_manifests
    - deployment_validation
    - iss_game_evidence
    - logs
    - metrics
    - blockers
    - persisted_project_state
    authority_rank: 2
  - id: scientific_and_safety_constraints
    role: non_bypassable_constraints
    required: true
    authority_rank: 3
  - id: work_prompt
    path: SKATAI_V2_WORK_PROMPT.md
    role: strategic_execution_framework_and_complete_capability_map
    required: true
    refresh_policy: read_when_strategy_gap_analysis_or_major_transition_requires_it
    authority_rank: 4
  - id: historical_context
    role: recovery_context_only
    required: false
    authority_rank: 5
  precedence_rule: 'Founding Specification and non-bypassable scientific constraints define project intent and validity.
    Fresh verified state determines reality. The Work Prompt guides future work and completeness analysis but must
    never cause verified completed work to be repeated. Historical conversation state is subordinate to direct evidence.

    '
global_invariants:
- id: ONE_GLOBAL_COORDINATOR
  rule: 'Only the Orchestrator Superbrain owns global project strategy, global prioritization, dependency resolution,
    and final integration decisions.

    '
- id: WORKERS_ARE_BOUNDED
  rule: 'Worker agents operate only within explicit task contracts. They do not own, redefine, or independently
    reprioritize the complete SkatAI V2 project.

    '
- id: WORK_PROMPT_ALIGNMENT
  rule: 'Every substantial autonomous task must map to at least one remaining capability, dependency, blocker, verification
    requirement, or end-state requirement derived from the Founding Specification or Work Prompt.

    '
- id: NO_BLIND_WORK_PROMPT_REPLAY
  rule: 'The Work Prompt is a strategic map, not a linear checklist. The Orchestrator must compare it against verified
    current state and must not redo already verified or superseded work.

    '
- id: EVIDENCE_OVER_CLAIMS
  rule: 'Worker conclusions are not authoritative until supported by inspectable evidence and accepted by the Orchestrator
    or an assigned independent validator where required.

    '
- id: SCIENTIFIC_INTEGRITY
  rule: 'Training and evaluation are controlled experiments. Dataset provenance, split definitions, seeds where
    relevant, model/config identity, code revision, evaluation rules, raw results, summaries, and material runtime
    context must be preserved.

    '
- id: NO_ANECDOTAL_PROMOTION
  rule: 'A checkpoint, isolated ISS win, small favorable sample, or worker recommendation can never alone authorize
    model promotion.

    '
- id: PERSIST_BEFORE_SESSION_END
  rule: 'Critical state, evidence, manifests, results, and decisions must be durably persisted before a worker or
    Orchestrator session is considered complete.

    '
- id: CONVERSATION_IS_NOT_AUTHORITY
  rule: 'Chat/session memory is not canonical project state. Repository, manifests, persisted state, runtime evidence,
    and durable artifacts take precedence.

    '
- id: MINIMUM_NECESSARY_CHANGE
  rule: 'Changes should be minimal, reversible, observable, and verified. Destructive or lockout-prone actions require
    explicit justification and safeguards.

    '
- id: DEPLOYMENT_REALITY
  rule: 'Accepted model quality is insufficient by itself. An accepted release must also be reproducibly packageable,
    version-identifiable, compatible with the target runtime, and deployment-valid.

    '
orchestrator:
  id: orchestrator-superbrain
  role: ORCHESTRATOR_SUPERBRAIN
  type: persistent_global_coordinator
  persistent: true
  singleton: true
  purpose: 'Maintain the complete SkatAI V2 project model and continuously coordinate bounded worker agents/sessions
    so that verified current reality advances toward the full final project goal.

    '
  owns:
  - complete_project_context
  - project_goal_model
  - work_prompt_capability_map
  - capability_gap_graph
  - dependency_graph
  - blocker_graph
  - priority_queue
  - active_task_registry
  - worker_session_registry
  - evidence_registry
  - decision_registry
  - accepted_model_registry
  - release_registry
  - global_project_state
  - continuity_and_recovery_state
  does_not_own_exclusively:
  - raw_domain_research
  - code_implementation
  - training_execution
  - evaluation_execution
  - iss_protocol_execution
  - infrastructure_operation
  - release_packaging_execution
  - test_execution
  authority:
    may:
    - inspect_all_authorized_project_state
    - refresh_authoritative_context
    - decompose_global_goals
    - create_task_graphs
    - create_worker_sessions
    - assign_worker_tasks
    - set_priorities
    - change_task_priority
    - pause_tasks
    - cancel_superseded_tasks
    - request_more_evidence
    - request_independent_validation
    - reject_incomplete_results
    - integrate_verified_results
    - resolve_task_dependencies
    - resolve_cross_worker_conflicts
    - update_persisted_project_state
    - create_followup_tasks
    - trigger_recovery_work
    - initiate_release_candidate_flow
    may_not:
    - bypass_founding_specification
    - bypass_scientific_gates
    - fabricate_or_rewrite_experiment_evidence
    - redefine_experiment_variables_to_improve_results_in_place
    - promote_model_without_required_gate_evidence
    - treat_worker_assertion_as_verified_fact
    - destroy_useful_negative_results
    - expose_unnecessary_secrets
    - infer_current_state_from_stale_chat_when_direct_evidence_is_available
    - declare_project_complete_without_completion_definition_satisfied
  responsibilities:
  - understand_complete_project
  - maintain_global_project_model
  - strategically_use_work_prompt
  - compare_desired_state_to_verified_reality
  - identify_capability_gaps
  - identify_true_blockers
  - maintain_dependency_graph
  - prioritize_high_value_work
  - issue_bounded_work_orders
  - coordinate_parallel_independent_work
  - monitor_task_and_worker_progress
  - inspect_worker_evidence
  - ensure_scientific_validity
  - detect_cross_worker_conflicts
  - integrate_verified_outputs
  - maintain_persistent_state
  - recover_after_session_or_runtime_loss
  - verify_progress_toward_final_goal
  - stop_or_supersede_nonvaluable_work
  - maintain_project_continuity
  context_requirements:
    always_available:
    - founding_specification_summary_and_hash
    - current_project_state
    - capability_gap_graph
    - dependency_graph
    - active_tasks
    - accepted_decisions
    - known_blockers
    - accepted_model_and_release_identity
    load_on_demand:
    - full_work_prompt
    - full_repository_history
    - raw_logs
    - raw_experiment_results
    - raw_iss_game_records
    - external_research_corpus
work_prompt_integration:
  mode: strategic_adaptive
  principle: 'SKATAI_V2_WORK_PROMPT.md describes the intended complete operating system and lifecycle. The Orchestrator
    uses it to identify missing capabilities, plan major transitions, generate worker work orders, and detect drift
    from the final goal. It is not blindly replayed.

    '
  invoke_when:
  - selecting_next_major_project_direction
  - starting_or_finishing_a_major_phase
  - performing_capability_gap_analysis
  - recovering_after_loss_of_session_or_runtime_context
  - planning_cross_component_work
  - resolving_ambiguous_project_priority
  - determining_if_a_capability_is_missing
  - generating_new_worker_task_families
  - checking_end_to_end_completeness
  - auditing_alignment_with_final_goal
  avoid_when:
  - narrow_worker_task_is_already_well_defined
  - required_information_is_available_from_fresher_direct_evidence
  - action_would_only_repeat_verified_completed_work
  forbidden_behavior:
  - blindly_execute_work_prompt_top_to_bottom
  - copy_entire_work_prompt_into_every_worker
  - restart_completed_phases
  - prefer_prompt_narrative_over_current_direct_evidence
  - create_busywork_only_because_a_topic_is_mentioned
  strategic_reasoning_cycle:
  - refresh_latest_verified_state
  - compare_state_to_founding_specification
  - compare_state_to_work_prompt_end_state
  - update_capability_gap_graph
  - identify_blockers_and_dependencies
  - generate_candidate_high_value_work
  - rank_candidate_work
  - select_next_workset
  - assign_bounded_worker_tasks
  - monitor_results_and_evidence
  - independently_verify_where_required
  - integrate_verified_results
  - persist_project_state
  - reassess_against_end_state
  worker_context_policy:
    mode: minimum_sufficient_context
    include:
    - task_objective
    - global_goal_reference
    - relevant_work_prompt_capability_reference
    - relevant_founding_spec_constraints
    - freshest_verified_local_state
    - dependencies
    - required_inputs
    - authority
    - forbidden_actions
    - evidence_requirements
    - success_criteria
    - result_contract
    exclude_unless_needed:
    - unrelated_work_prompt_sections
    - unrelated_project_history
    - obsolete_state
    - unrelated_worker_tasks
    - unnecessary_secrets
    - large_raw_logs
capability_gap_model:
  allowed_states:
  - NOT_STARTED
  - PARTIAL
  - IMPLEMENTED
  - VERIFIED
  - BLOCKED
  - SUPERSEDED
  - NOT_REQUIRED
  required_fields:
  - capability_id
  - desired_state_reference
  - current_state
  - evidence
  - dependencies
  - blockers
  - next_verification
  - last_updated
  capabilities:
  - id: data_acquisition
    state: PARTIAL
  - id: dataset_validation
    state: PARTIAL
  - id: dataset_versioning_and_provenance
    state: PARTIAL
  - id: challenger_training
    state: PARTIAL
  - id: controlled_scientific_evaluation
    state: PARTIAL
  - id: promotion_rejection_gates
    state: PARTIAL
  - id: iss_external_validation
    state: PARTIAL
  - id: iss_evidence_capture
    state: PARTIAL
  - id: autonomous_runtime
    state: PARTIAL
  - id: release_packaging
    state: PARTIAL
  - id: deployment_validation
    state: PARTIAL
  - id: stable_skatai_interface
    state: NOT_STARTED
  - id: skat_software_integration
    state: NOT_STARTED
  - id: continuous_improvement_loop
    state: PARTIAL
  - id: full_recovery_and_persistence
    state: PARTIAL
priority_policy:
  order:
  - correctness_and_scientific_validity
  - preservation_of_valuable_evidence
  - removal_of_genuine_blockers
  - reproducibility_and_recoverability
  - deployment_validity
  - throughput_and_project_velocity
  - maintainability
  - cost
  scoring_dimensions:
    impact_on_final_goal: 1.0
    blocker_removal: 1.0
    scientific_risk_reduction: 1.0
    evidence_preservation: 0.9
    dependency_unlock_value: 0.9
    deployment_value: 0.8
    reproducibility_value: 0.8
    execution_cost: -0.4
    operational_risk: -0.8
    duplication_penalty: -1.0
  reject_candidate_if:
  - duplicate_of_verified_work
  - no_traceable_project_goal_contribution
  - based_only_on_stale_context
  - missing_required_authority
  - creates_scientific_contamination
  - lower_value_than_unblocked_critical_dependency_without_justification
worker_groups:
  strategic_control:
    purpose: Translate global project intent into correct bounded work and constraints.
    agents:
    - id: planner-tasking
      role: PLANNER_TASKING_AGENT
      session_mode: on_demand
      responsibilities:
      - roadmap_slicing
      - dependency_analysis
      - blocker_identification
      - task_graph_generation
      - work_order_generation
      - priority_sequencing
      - session_workload_planning
      reports_to: orchestrator-superbrain
    - id: architecture-interface
      role: ARCHITECTURE_INTERFACE_AGENT
      session_mode: on_demand
      responsibilities:
      - system_architecture
      - module_boundaries
      - stable_skatai_interface
      - decision_api_contracts
      - integration_contracts
      - runtime_compatibility
      - target_software_integration_architecture
      reports_to: orchestrator-superbrain
    - id: scientific-governance
      role: SCIENTIFIC_GOVERNANCE_AGENT
      session_mode: persistent_or_on_demand
      responsibilities:
      - experiment_definition_review
      - evaluation_rule_review
      - train_eval_separation
      - leakage_detection
      - holdout_protection
      - promotion_gate_validation
      - provenance_audit
      - uncertainty_requirements
      reports_to: orchestrator-superbrain
    - id: research-benchmark
      role: RESEARCH_BENCHMARK_AGENT
      session_mode: on_demand
      responsibilities:
      - SkatZero_research
      - Kermit_research
      - theCount_research
      - zoot_research
      - open_source_skat_ai_research
      - open_source_skat_software_research
      - literature_review
      - benchmark_method_research
      - relevant_tool_and_library_research
      reports_to: orchestrator-superbrain
  execution:
    purpose: Perform substantive data, model, external-play, runtime, and infrastructure work.
    agents:
    - id: data-pipeline
      role: DATA_PIPELINE_AGENT
      session_mode: persistent_or_job
      responsibilities:
      - iss_game_ingestion
      - historical_game_ingestion
      - validation
      - deduplication
      - quarantine
      - split_generation
      - provenance_capture
      - dataset_versioning
      - dataset_manifest_generation
      - storage_lifecycle
      reports_to: orchestrator-superbrain
    - id: training
      role: TRAINING_AGENT
      session_mode: job
      responsibilities:
      - training_configuration
      - training_runs
      - checkpoint_management
      - accelerator_usage
      - resource_efficiency
      - seed_and_config_capture
      - training_manifest_generation
      - resumable_training
      reports_to: orchestrator-superbrain
    - id: evaluation
      role: EVALUATION_AGENT
      session_mode: job
      responsibilities:
      - controlled_matches
      - offline_evaluation
      - challenger_vs_champion
      - benchmark_evaluation
      - statistical_analysis
      - uncertainty_reporting
      - raw_result_persistence
      - gate_evidence_generation
      reports_to: orchestrator-superbrain
    - id: iss-integration
      role: ISS_INTEGRATION_AGENT
      session_mode: persistent
      responsibilities:
      - iss_protocol_adapter
      - authentication
      - session_lifecycle
      - table_lifecycle
      - multi_table_operation
      - bidding_events
      - contract_events
      - discard_events
      - cardplay_events
      - reconnect
      - deduplication
      - live_game_capture
      - decision_latency_capture
      - game_evidence_persistence
      reports_to: orchestrator-superbrain
      interfaces:
        iss:
          host: skatgame.net
          port: 7000
          client_id: SkatAI
          password_source: secret_reference_only
    - id: autonomy-runtime
      role: AUTONOMY_RUNTIME_AGENT
      session_mode: persistent
      responsibilities:
      - controller_runtime
      - worker_session_lifecycle
      - task_queue_execution
      - work_conservation
      - bounded_recovery
      - session_rotation
      - fault_recovery
      - idempotency
      - lease_management
      - restart_recovery
      - persistent_state_recovery
      - orphan_prevention
      - duplicate_effect_prevention
      reports_to: orchestrator-superbrain
    - id: infrastructure-storage
      role: INFRASTRUCTURE_STORAGE_AGENT
      session_mode: persistent_or_on_demand
      responsibilities:
      - runpod_compute
      - cpu_capacity
      - gpu_capacity
      - deployment_hunting
      - hetzner_object_storage
      - network_storage
      - artifact_persistence
      - capacity_monitoring
      - throughput_measurement
      - latency_measurement
      - cost_efficiency
      - storage_migration
      reports_to: orchestrator-superbrain
  reliability_delivery:
    purpose: Independently verify, observe, preserve, package, and deliver project progress.
    agents:
    - id: qa-validation
      role: QA_VALIDATION_AGENT
      session_mode: on_demand_or_gate
      responsibilities:
      - unit_tests
      - integration_tests
      - regression_tests
      - contract_tests
      - reproducibility_checks
      - scientific_consistency_checks
      - deployment_validation
      - correctness_audits
      - release_acceptance_checks
      reports_to: orchestrator-superbrain
    - id: observability-recovery
      role: OBSERVABILITY_RECOVERY_AGENT
      session_mode: persistent
      responsibilities:
      - logging
      - telemetry
      - metrics
      - throughput_monitoring
      - latency_analysis
      - queueing_analysis
      - cpu_gpu_memory_io_analysis
      - anomaly_detection
      - failure_classification
      - incident_evidence_capture
      - rollback_validation
      - recovery_verification
      reports_to: orchestrator-superbrain
    - id: release-packaging
      role: RELEASE_PACKAGING_AGENT
      session_mode: gate
      responsibilities:
      - release_manifest
      - accepted_model_packaging
      - runtime_packaging
      - version_identity
      - checksums
      - dependency_capture
      - deployment_bundle
      - rollback_bundle
      - compatibility_validation
      - reproducible_build_validation
      reports_to: orchestrator-superbrain
    - id: documentation-project-state
      role: DOCUMENTATION_PROJECT_STATE_AGENT
      session_mode: persistent_or_event_driven
      responsibilities:
      - current_state_document
      - decision_records
      - experiment_records
      - negative_results
      - release_history
      - blocker_registry
      - continuation_state
      - evidence_indexes
      - architecture_records
      - handoff_records
      - latest_verified_state_summary
      reports_to: orchestrator-superbrain
agent_count:
  orchestrators: 1
  strategic_control_workers: 4
  execution_workers: 6
  reliability_delivery_workers: 4
  total_roles: 15
  permanent_llm_sessions_required: false
  note: 'Roles are logical responsibilities, not a requirement for 15 continuously running LLM sessions. The Orchestrator
    should instantiate worker sessions only when justified by active work.

    '
session_model:
  orchestrator:
    lifecycle: persistent
    recovery_source:
    - persisted_project_state
    - repository
    - task_registry
    - decision_registry
    - evidence_registry
    - runtime_inspection
  workers:
    default_lifecycle: ephemeral_bounded
    reusable_role_context: true
    global_strategy_authority: false
    may_spawn_subworkers: false
    may_request_followup_context: true
    intelligence_profile: low_cost_bounded_executor
    default_reasoning_effort: low
    default_model_policy: cheapest_reliably_capable
    deterministic_first: true
    may_self_escalate_model_tier: false
    must_escalate_global_reasoning_to_orchestrator: true
  concurrency:
    enabled: true
    requirements:
    - tasks_are_dependency_independent
    - write_sets_do_not_conflict_or_are_explicitly_coordinated
    - evaluation_independence_is_preserved
    - shared_resource_capacity_is_sufficient
    repository_write_policy:
      default: serialize_conflicting_writes
      independent_changes: parallel_allowed_with_isolation
    experiment_policy:
      independent_experiments: parallel_allowed
      shared_holdout_or_gate_state: controlled_access
task_contract:
  schema:
    task_id:
      type: string
      required: true
    parent_task_id:
      type:
      - string
      - 'null'
      required: false
    task_family:
      type: string
      required: true
    assigned_agent:
      type: string
      required: true
    priority:
      type: string
      enum:
      - P0
      - P1
      - P2
      - P3
      required: true
    global_goal_reference:
      type: array
      items: string
      required: true
    work_prompt_capability_reference:
      type: array
      items: string
      required: true
    current_gap:
      type: string
      required: true
    objective:
      type: string
      required: true
    rationale:
      type: string
      required: true
    scope:
      type: array
      items: string
      required: true
    non_goals:
      type: array
      items: string
      required: false
    dependencies:
      type: array
      items: string
      required: false
    required_inputs:
      type: array
      items: artifact_reference
      required: false
    authority:
      type: object
      required: true
      fields:
        read:
          type: array
        write:
          type: array
        execute:
          type: array
        forbidden:
          type: array
    evidence_requirements:
      type: array
      items: string
      required: true
    success_criteria:
      type: array
      items: string
      required: true
    rollback_requirements:
      type: array
      items: string
      required: false
    state:
      type: string
      enum:
      - READY
      - RUNNING
      - BLOCKED
      - VERIFYING
      - COMPLETE
      - FAILED
      - SUPERSEDED
      required: true
    created_at:
      type: timestamp
      required: true
    updated_at:
      type: timestamp
      required: true
    execution_profile:
      type: object
      required: true
      fields:
        preferred_execution_mode:
          type: string
          enum:
          - deterministic
          - very_low_cost_model
          - low_cost_model
          - mid_cost_model
          - orchestrator_only
        reasoning_effort:
          type: string
          enum:
          - minimal
          - low
          - medium
        max_cost_class:
          type: string
          enum:
          - deterministic
          - very_low
          - low
          - mid
          - superbrain
        model_escalation_requires_orchestrator:
          type: boolean
  validation_rules:
  - global_goal_reference must not be empty
  - work_prompt_capability_reference must not be empty unless explicitly exempted
  - success_criteria must be externally verifiable
  - authority.write must not exceed agent role authority
  - forbidden actions must be explicit for risky tasks
  - duplicate verified work must be rejected
  - scientific tasks must reference experiment identity
  - worker execution profile must use the lowest sufficient cost class
  - worker model escalation requires orchestrator authorization
  - deterministic execution must be preferred when reliable
worker_result_contract:
  schema:
    task_id:
      type: string
      required: true
    worker_id:
      type: string
      required: true
    worker_session_id:
      type: string
      required: true
    status:
      type: string
      enum:
      - COMPLETE
      - PARTIAL
      - BLOCKED
      - FAILED
      required: true
    observations:
      type: array
      required: true
    hypotheses:
      type: array
      required: false
    confirmed_causes:
      type: array
      required: false
    changes:
      type: array
      required: true
    evidence:
      type: array
      required: true
    verification:
      type: array
      required: true
    unresolved:
      type: array
      required: true
    risks:
      type: array
      required: false
    artifacts:
      type: array
      required: false
    repository_revision:
      type:
      - string
      - 'null'
      required: false
    dirty_worktree:
      type:
      - boolean
      - 'null'
      required: false
    experiment_ids:
      type: array
      required: false
    recommended_followups:
      type: array
      required: false
    completed_at:
      type: timestamp
      required: true
    execution_telemetry:
      type: object
      required: true
      fields:
        execution_mode:
          type: string
        model_class:
          type:
          - string
